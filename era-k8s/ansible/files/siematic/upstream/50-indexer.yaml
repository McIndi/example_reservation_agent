# Internal Daphne indexer. No Route: only the two shippers connect here.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: siematic-indexer-ca
  namespace: siematic
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: siematic-indexer
  namespace: siematic
  labels:
    app: siematic-indexer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: siematic-indexer
  template:
    metadata:
      labels:
        app: siematic-indexer
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: indexer
          image: ghcr.io/mcindi/siematic@sha256:b3d85c072dd9e03ac87954e613525b20f1bfa3e21d2a842a3e245bfc59dacc6b
          command: ["python", "manage.py", "indexer"]
          envFrom:
            - configMapRef:
                name: siematic-app
            - secretRef:
                name: siematic-app
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: SIEMatic.settings.indexer
            - name: INDEXER_HOSTNAME
              value: 0.0.0.0
            - name: INDEXER_SSL_CERT
              value: /etc/tls/private/tls.crt
            - name: INDEXER_SSL_KEY
              value: /etc/tls/private/tls.key
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: siematic-postgres
                  key: database-user
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: siematic-postgres
                  key: database-password
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: siematic-postgres
                  key: database-name
          ports:
            - name: https
              containerPort: 8000
          volumeMounts:
            - name: serving-cert
              mountPath: /etc/tls/private
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            tcpSocket:
              port: https
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: https
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: https
            periodSeconds: 10
      volumes:
        - name: serving-cert
          secret:
            secretName: siematic-indexer-tls
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: siematic-indexer
  namespace: siematic
  labels:
    app: siematic-indexer
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: siematic-indexer-tls
spec:
  ports:
    - name: https
      port: 8000
      targetPort: https
  selector:
    app: siematic-indexer
