# Vault-backed Secrets for SIEMatic.
#
# Follows the pattern already used for rossoctl-system, keycloak, and
# mcp-system in
# ../../docs/how-to-guides/integrate-vault-with-rossoctl-secrets.md: one
# service account per namespace, a namespace-scoped Vault role and policy, and
# a VaultAuth that only this namespace can use. One namespace cannot read
# another's credentials.
#
# Unlike the existing VaultStaticSecrets, both of these set create: true.
# Nothing else creates them; there is no Helm chart behind SIEMatic.
#
# The Vault side has to exist first. See the README in this directory for the
# policy, role, and the two kv-v2 writes. Apply this before 10-postgres.yaml
# and 30-web.yaml, because both wait on Secrets that VSO has not written yet.
#
# Apply with: oc apply -f 05-vault-secrets.yaml
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets-auth
  namespace: siematic
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-auth
  namespace: siematic
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: siematic-vso
    serviceAccount: vault-secrets-auth
  vaultConnectionRef: vault-secrets-operator-system/vault-connection
---
# Keys at this path must be named exactly as the containers read them:
# database-user, database-password, database-name.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: siematic-postgres
  namespace: siematic
spec:
  vaultAuthRef: vault-auth
  mount: rossoctl
  path: siematic-postgres
  type: kv-v2
  destination:
    name: siematic-postgres
    create: true
    type: Opaque
  refreshAfter: 1h
---
# These are deliberately separate: the pod that reads pods/log across two
# namespaces must never receive the Keycloak client credential.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: siematic-kube-shipper
  namespace: siematic
spec:
  vaultAuthRef: vault-auth
  mount: rossoctl
  path: siematic-kube-shipper
  type: kv-v2
  destination:
    name: siematic-kube-shipper
    create: true
    type: Opaque
  refreshAfter: 1h
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: siematic-keycloak-shipper
  namespace: siematic
spec:
  vaultAuthRef: vault-auth
  mount: rossoctl
  path: siematic-keycloak-shipper
  type: kv-v2
  destination:
    name: siematic-keycloak-shipper
    create: true
    type: Opaque
  refreshAfter: 1h
---
# Keys at this path are read with envFrom, so each one becomes an environment
# variable under its own name: DJANGO_SECRET_KEY and OIDC_RP_CLIENT_SECRET.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: siematic-app
  namespace: siematic
spec:
  vaultAuthRef: vault-auth
  mount: rossoctl
  path: siematic-app
  type: kv-v2
  destination:
    name: siematic-app
    create: true
    type: Opaque
  refreshAfter: 1h
