# One owner for every Kubernetes log cursor. Recreate prevents two collectors
# from shipping the same target during a rolling update.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: siematic-kube-logs
  namespace: siematic
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: siematic-kube-logs
  namespace: siematic
  labels:
    app: siematic-kube-logs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: siematic-kube-logs
  template:
    metadata:
      labels:
        app: siematic-kube-logs
    spec:
      serviceAccountName: siematic-kube-logs
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube-logs
          image: ghcr.io/mcindi/siematic@sha256:b3d85c072dd9e03ac87954e613525b20f1bfa3e21d2a842a3e245bfc59dacc6b
          command: ["python", "manage.py", "agent"]
          envFrom:
            - configMapRef:
                name: siematic-app
            - secretRef:
                name: siematic-app
            - secretRef:
                name: siematic-kube-shipper
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: SIEMatic.settings.agent
            - name: SIEMATIC_AGENT_PROFILE
              value: /etc/siematic/profile/kube-logs.json
            - name: SIEMATIC_AGENT_ID
              value: shipper-kube-logs
          volumeMounts:
            - name: indexer-ca
              mountPath: /etc/siematic/indexer-ca
              readOnly: true
            - name: shipper-profiles
              mountPath: /etc/siematic/profile
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: indexer-ca
          configMap:
            name: siematic-indexer-ca
        - name: shipper-profiles
          configMap:
            name: siematic-shipper-profiles
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: siematic-kube-logs
  namespace: team1
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  # resolve_pod() reads the Deployment to find its current pod for any
  # target defined by `deployment: name` (both team1 targets are). The
  # vault target resolves through a pod label selector instead, so its
  # Role below does not need this.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: siematic-kube-logs
  namespace: team1
subjects:
  - kind: ServiceAccount
    name: siematic-kube-logs
    namespace: siematic
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: siematic-kube-logs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: siematic-kube-logs
  namespace: vault
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: siematic-kube-logs
  namespace: vault
subjects:
  - kind: ServiceAccount
    name: siematic-kube-logs
    namespace: siematic
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: siematic-kube-logs
