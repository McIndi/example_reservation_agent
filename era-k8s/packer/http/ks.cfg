#version=F44
# Anaconda kickstart for the era-k8s Vagrant boxes (VirtualBox and VMware), delivered over Packer's HTTP
# server. Unattended text-mode install of a minimal Fedora 44 Server with the vagrant user; everything
# Kubernetes-related is installed afterwards by provision/*.sh, the same scripts the Lima template runs.
text
eula --agreed
reboot

# netinst ISO: the install source must be a network mirror (the media carries no repo).
url --metalink="https://mirrors.fedoraproject.org/metalink?repo=fedora-44&arch=x86_64"

lang en_US.UTF-8
keyboard us
# The node keeps UTC (SIEMatic's log shipper compares container log stamps, which CRI-O writes in the node's zone, with UTC checkpoints).
timezone UTC --utc

# The hostname is set here and never changed afterwards (the Vagrantfile names the machine the same): the
# kubelet derives its node name from it, and a rename after the first-boot init orphans the node.
network --bootproto=dhcp --device=link --activate --hostname=era-k8s
rootpw --plaintext vagrant
user --name=vagrant --password=vagrant --plaintext --groups=wheel

firewall --enabled --service=ssh
selinux --enforcing
services --enabled=sshd,chronyd

bootloader --location=mbr --append="net.ifnames=0 biosdevname=0"
zerombr
clearpart --all --initlabel
# No swap: kubelet refuses to run with swap on, and provision/10-packages.sh also removes zram.
autopart --type=lvm --noswap

skipx

%packages --ignoremissing --excludeWeakdeps --instLangs=en_US.utf-8
@core
openssh-server
sudo
chrony
curl
wget
rsync
tar
python3
open-vm-tools
cloud-init
# A generic initramfs (every storage driver), so the same disk boots on VirtualBox, VMware, KVM and Hyper-V:
# Fedora's default is host-only, built for the installer's hardware. finish.sh regenerates it.
dracut-config-generic
dnf-plugins-core
-aic94xx-firmware
-iwl*-firmware
-linux-firmware
%end

%post --erroronfail --log=/root/ks-post.log
echo "vagrant ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/99-vagrant
chmod 0440 /etc/sudoers.d/99-vagrant
sed -i 's/^#\\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
sed -i 's/^#\\?UseDNS.*/UseDNS no/' /etc/ssh/sshd_config
sed -i 's/^#\\?PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
systemctl enable sshd
%end
