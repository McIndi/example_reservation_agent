# GENERATED by bin/render-template from k8s.yaml.in and provision/*.sh. Edit those, then run
# `bin/render-template`; `bin/render-template --check` tells whether this file is current.
# k8s.yaml -- single-node Kubernetes (kubeadm + CRI-O + Calico + local-path storage) on Fedora 44, bridged to the LAN,
# with the controller toolset (Ansible, helm, kubectl) inside, exportable as a pre-init image (export/RECIPIENT.md).
# Built and run on Intel and Apple silicon Macs with Lima 2.x (vz).
#
# Usage:
#   limactl start --name k8s k8s.yaml --tty=false --timeout 25m
#   limactl start --name k8s --set 'del(.networks)' k8s.yaml --tty=false    # without socket_vmnet (no LAN address)
#   export KUBECONFIG="$HOME/.lima/k8s/copied-from-guest/kubeconfig.yaml"
#   kubectl get nodes
#
# Derived from Lima's own k8s template (Ubuntu, containerd, flannel), rewritten for dnf, CRI-O,
# SELinux enforcing, firewalld, Calico, and a bridged interface present from first boot.

minimumLimaVersion: 2.0.0

# Guest OS: Fedora 44 Cloud, the same image as the `podman` instance (already in Lima's cache).
# Alternatives: template:_images/almalinux-10 (RHEL 10 rebuild; ships firewalld, no zram);
# a local RHEL 10 qcow2 via an `images:` entry. CentOS Stream needs legacy BIOS: not bootable on vz Intel.
base:
- template:_images/fedora-44

cpus: 8
memory: "24GiB"
disk: "100GiB"

# No host folders: nothing in the image may depend on the host (the playbooks are baked into /opt/era-k8s
# and the export sanitizer runs without a mount). Add one here if you want, e.g. a repo checkout at /vagrant.
mounts: []
# CRI-O is the runtime; keep Lima from installing its own containerd/nerdctl.
containerd:
  system: false
  user: false

# Optional, macOS 26 only: Apple's sparse image format for vz, aimed at I/O performance. One-way
# (cannot be converted back to raw); the snapshot helper (lima-snap) works with either format.
# vmOpts:
#   vz:
#     diskImageFormat: asif

# rossoctl's URLs carry port 8080 (and 8443 once TLS is on), because Kind maps host 8080 to the
# NodePort 30080. Same scheme here: Lima forwards the NodePorts to those host ports, and inside the
# VM firewalld forwards 8080/8443 to the NodePorts so the identical URLs work when the VM runs on
# another hypervisor and is reached by its own address (see provision step 4).
portForwards:
- guestPort: 30080
  hostPort: 8080
- guestPort: 30443
  hostPort: 8443

# Bridged from the start: lima0 gets a DHCP address on the LAN via socket_vmnet (already installed
# and used by the podman instance). eth0 stays the Lima user-mode network (192.168.5.15) and is the
# node's own address; lima0 is only how clients reach the API server and NodePorts from the LAN.
networks:
- lima: bridged

provision:  # filled from provision/*.sh by bin/render-template; do not add entries here
- mode: system
  script: |
    #!/bin/bash
    # provision/10-packages.sh
    export ERA_STABILITY="{{.Param.stability}}"
    export ERA_RELEASE="{{.Param.release}}"
    export ERA_HELM_VERSION="{{.Param.helmVersion}}"
    # era-k8s provisioning, step 10: kernel modules, swap off, repos, packages, helm, SELinux for SPIRE, CRI-O + kubelet on
    # Shared by the Lima template (k8s.yaml is rendered from k8s.yaml.in + provision/*.sh by bin/render-template,
    # which exports the template's param: values as ERA_* variables) and by the Packer builds (which export the
    # same variables, or none: every variable below has the template's default). Runs as root on Fedora 44.
    set -eux -o pipefail
    : "${ERA_STABILITY:=stable}"
    : "${ERA_RELEASE:=stable}"
    : "${ERA_HELM_VERSION:=v3.22.1}"
    command -v kubeadm >/dev/null 2>&1 && exit 0

    cat <<EOF >/etc/modules-load.d/k8s.conf
    overlay
    br_netfilter
    EOF
    modprobe overlay
    modprobe br_netfilter
    cat <<EOF >/etc/sysctl.d/99-kubernetes-cri.conf
    net.bridge.bridge-nf-call-iptables  = 1
    net.bridge.bridge-nf-call-ip6tables = 1
    net.ipv4.ip_forward                 = 1
    EOF
    sysctl --system

    # kubelet refuses swap. Fedora Cloud images use zram swap, and its unit may start AFTER this script
    # runs (first build 2026-10-17: the check found no swap yet, zram came up later, kubelet died).
    # So: unconditional, and the generator is disabled for every future boot.
    swapoff -a || true
    rpm -q zram-generator-defaults >/dev/null 2>&1 && dnf -y remove zram-generator-defaults
    touch /etc/systemd/zram-generator.conf           # empty config = no zram devices
    systemctl mask systemd-zram-setup@zram0.service 2>/dev/null || true
    systemctl stop systemd-zram-setup@zram0.service 2>/dev/null || true

    # Keep NetworkManager away from Calico's interfaces (Calico's documented setting).
    mkdir -p /etc/NetworkManager/conf.d
    cat <<EOF >/etc/NetworkManager/conf.d/calico.conf
    [keyfile]
    unmanaged-devices=interface-name:cali*;interface-name:tunl*;interface-name:vxlan.calico;interface-name:vxlan-v6.calico;interface-name:wireguard.cali;interface-name:wg-v6.cali
    EOF

    STABILITY="${ERA_STABILITY}"
    if [ "$ERA_RELEASE" = stable ]; then
      RELEASE=$(curl -L -s https://dl.k8s.io/release/stable.txt | cut -d'.' -f1-2)
    else
      RELEASE="${ERA_RELEASE}"
    fi

    cat <<EOF >/etc/yum.repos.d/kubernetes.repo
    [kubernetes]
    name=Kubernetes
    baseurl=https://pkgs.k8s.io/core:/${STABILITY}:/${RELEASE}/rpm/
    enabled=1
    gpgcheck=1
    gpgkey=https://pkgs.k8s.io/core:/${STABILITY}:/${RELEASE}/rpm/repodata/repomd.xml.key
    EOF
    cat <<EOF >/etc/yum.repos.d/cri-o.repo
    [cri-o]
    name=CRI-O
    baseurl=https://pkgs.k8s.io/addons:/cri-o:/${STABILITY}:/${RELEASE}/rpm/
    enabled=1
    gpgcheck=1
    gpgkey=https://pkgs.k8s.io/addons:/cri-o:/${STABILITY}:/${RELEASE}/rpm/repodata/repomd.xml.key
    EOF

    # firewalld is installed here because Fedora Cloud does not ship it (AlmaLinux does).
    # The second group is the controller toolset (what ocpclient-fedora44 carries, oc replaced by
    # kubectl/helm): the VM drives its own platform install with Ansible, so one image serves
    # Brian, Cliff and anyone else without a second VM.
    # (dnf5 on Fedora 44 has no --disableexcludes; so install first, then add the exclude= guard below)
    dnf -y install \
      cri-o kubelet kubeadm kubectl cri-tools \
      container-selinux conntrack-tools iproute-tc ethtool socat \
      firewalld podman buildah skopeo \
      git ansible-core ansible-collection-kubernetes-core python3-kubernetes python3-pip \
      jq openssl bash-completion tar gzip htop dos2unix policycoreutils-python-utils
    # Helm 3 from upstream: rossoctl requires Helm >= 3.18 and < 4, and Fedora 44 packages Helm 4.
    # The only architecture-specific download in this template: Lima's Fedora image template carries
    # x86_64 and aarch64 entries, and pkgs.k8s.io, Calico and local-path-provisioner are multi-arch.
    HELM="${ERA_HELM_VERSION}"
    case "$(uname -m)" in x86_64) HELM_ARCH=amd64 ;; aarch64) HELM_ARCH=arm64 ;; *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;; esac
    curl -fsSL "https://get.helm.sh/helm-${HELM}-linux-${HELM_ARCH}.tar.gz" | tar -xz -C /tmp "linux-${HELM_ARCH}/helm"
    install -m 0755 "/tmp/linux-${HELM_ARCH}/helm" /usr/local/bin/helm && rm -rf "/tmp/linux-${HELM_ARCH}"
    kubectl completion bash >/etc/bash_completion.d/kubectl
    /usr/local/bin/helm completion bash >/etc/bash_completion.d/helm
    mkdir -p /opt/era-k8s
    # Upstream convention: a routine `dnf upgrade` must not move the cluster to a new minor.
    # Deliberate upgrades: dnf5 `--disable-excludes=kubernetes`, dnf4 `--disableexcludes=kubernetes`.
    echo 'exclude=kubelet kubeadm kubectl cri-tools kubernetes-cni' >>/etc/yum.repos.d/kubernetes.repo
    swapoff -a || true                                # again, in case zram came up during the installs
    # SELinux enforcing, with the platform's host-path sockets: SPIRE's agent socket directory must be
    # reachable by unprivileged pods (first platform install: the OIDC provider got "connect:
    # permission denied"). Label it container_file_t and recreate it with that label at every boot.
    semanage fcontext -a -t container_file_t '/run/spire(/.*)?' 2>/dev/null || true
    cat <<EOF >/etc/tmpfiles.d/era-spire.conf
    # era-k8s: SPIRE agent sockets must be reachable by unprivileged pods under SELinux
    d /run/spire 0755 root root -
    d /run/spire/agent-sockets 0777 root root -
    Z /run/spire - - - - -
    EOF
    systemd-tmpfiles --create /etc/tmpfiles.d/era-spire.conf
    systemctl enable --now crio
    systemctl enable --now kubelet
- mode: system
  script: |
    #!/bin/bash
    # provision/20-config.sh
    export ERA_K8S_VERSION="{{.Param.version}}"
    export ERA_CALICO_VERSION="{{.Param.calicoVersion}}"
    export ERA_LOCAL_PATH_VERSION="{{.Param.localPathVersion}}"
    export ERA_DOMAIN="{{.Param.domain}}"
    export ERA_LLM_PROVIDER="{{.Param.llmProvider}}"
    export ERA_LLM_API_BASE="{{.Param.llmApiBase}}"
    export ERA_LLM_MODEL="{{.Param.llmModel}}"
    export ERA_TLS="{{.Param.tls}}"
    # era-k8s provisioning, step 20: /etc/era-k8s/config.env (recipient settings) and build.env (versions for k8s-init.sh)
    # Shared by the Lima template (k8s.yaml is rendered from k8s.yaml.in + provision/*.sh by bin/render-template,
    # which exports the template's param: values as ERA_* variables) and by the Packer builds (which export the
    # same variables, or none: every variable below has the template's default). Runs as root on Fedora 44.
    set -eux -o pipefail
    : "${ERA_DOMAIN:=localtest.me}"
    : "${ERA_LLM_PROVIDER:=in-cluster}"
    : "${ERA_LLM_API_BASE:=http://ollama.ollama.svc.cluster.local:11434/v1}"
    : "${ERA_LLM_MODEL:=llama3.2:3b-instruct-q4_K_M}"
    : "${ERA_TLS:=true}"
    : "${ERA_K8S_VERSION:=stable}"
    : "${ERA_CALICO_VERSION:=v3.33.0}"
    : "${ERA_LOCAL_PATH_VERSION:=v0.0.37}"
    mkdir -p /etc/era-k8s
    # Versions baked into this image, read by /usr/local/sbin/k8s-init.sh at first boot.
    cat <<EOF >/etc/era-k8s/build.env
    ERA_K8S_VERSION=${ERA_K8S_VERSION}
    ERA_CALICO_VERSION=${ERA_CALICO_VERSION}
    ERA_LOCAL_PATH_VERSION=${ERA_LOCAL_PATH_VERSION}
    EOF
    [ -f /etc/era-k8s/config.env ] && exit 0
    cat <<EOF >/etc/era-k8s/config.env
    # era-k8s settings. Read by /usr/local/sbin/k8s-init.sh and by the platform playbooks (Ansible).
    # Hostnames of the platform: <service>.ERA_DOMAIN. localtest.me resolves to 127.0.0.1 (works on the Mac
    # through Lima's port forwards); for LAN access use e.g. 10-15-10-120.sslip.io or a real domain.
    ERA_DOMAIN=${ERA_DOMAIN}
    # LLM for agents and the IBAC judge. in-cluster = the Ollama Deployment in namespace ollama.
    # external = an OpenAI-compatible endpoint; its key comes from the secrets file, never from here.
    ERA_LLM_PROVIDER=${ERA_LLM_PROVIDER}
    ERA_LLM_API_BASE=${ERA_LLM_API_BASE}
    ERA_LLM_MODEL=${ERA_LLM_MODEL}
    # TLS for the platform's gateway: true = cert-manager with the local CA (ClusterIssuer era-ca),
    # HTTPS listener on 443 -> NodePort 30443. Development clients may skip verification.
    ERA_TLS=${ERA_TLS}
    # Where locally built images go: in-cluster (rossoctl-deps registry, NodePort 30500) or ghcr.
    ERA_REGISTRY=in-cluster
    # Where \`era update\` refreshes /opt/era-k8s from: the era-k8s branch of the agent repo, folder era-k8s.
    ERA_REPO=https://github.com/McIndi/example_reservation_agent.git
    ERA_BRANCH=era-k8s
    ERA_REPO_SUBDIR=era-k8s
    EOF
    chmod 0644 /etc/era-k8s/config.env
- mode: system
  script: |
    #!/bin/bash
    # provision/30-tuning.sh
    # era-k8s provisioning, step 30: UTC, inotify, virtual-disk scheduler, transparent huge pages off
    # Shared by the Lima template (k8s.yaml is rendered from k8s.yaml.in + provision/*.sh by bin/render-template,
    # which exports the template's param: values as ERA_* variables) and by the Packer builds (which export the
    # same variables, or none: every variable below has the template's default). Runs as root on Fedora 44.
    set -eux -o pipefail
    # The node keeps UTC: CRI-O/conmon stamp container logs in the local zone, and SIEMatic's kube-logs
    # shipper compares those stamps as strings with a UTC checkpoint (found 2026-10-18); OpenShift nodes
    # are UTC too. Lima copies the Mac's zone into the guest otherwise.
    timedatectl set-timezone UTC 2>/dev/null || ln -sf /usr/share/zoneinfo/UTC /etc/localtime
    # inotify: kubelet and many pods exhaust Fedora's defaults (128 instances) -> "too many open files"
    cat <<EOF >/etc/sysctl.d/99-guest-tuning.conf
    fs.inotify.max_user_watches = 524288
    fs.inotify.max_user_instances = 512
    vm.swappiness = 10
    EOF
    sysctl --system
    # virtual disks: not rotational, no guest-side scheduling (the host already schedules)
    cat <<EOF >/etc/udev/rules.d/60-virtual-disk.rules
    ACTION=="add|change", KERNEL=="vd[a-z]|sd[a-z]|nvme[0-9]n[0-9]", ATTR{queue/rotational}="0", ATTR{queue/scheduler}="none"
    EOF
    udevadm control --reload-rules
    udevadm trigger --action=change --subsystem-match=block
    # transparent huge pages off (etcd, Keycloak's Postgres)
    cat <<EOF >/etc/systemd/system/disable-thp.service
    [Unit]
    Description=Disable Transparent Huge Pages
    DefaultDependencies=no
    After=sysinit.target local-fs.target
    Before=basic.target
    [Service]
    Type=oneshot
    RemainAfterExit=yes
    ExecStart=/bin/sh -c 'echo never > /sys/kernel/mm/transparent_hugepage/enabled'
    ExecStart=/bin/sh -c 'echo never > /sys/kernel/mm/transparent_hugepage/defrag'
    [Install]
    WantedBy=basic.target
    EOF
    systemctl daemon-reload
    systemctl enable --now disable-thp.service
- mode: system
  script: |
    #!/bin/bash
    # provision/40-firewall.sh
    # era-k8s provisioning, step 40: firewalld: API server, kubelet, NodePorts, 8080/8443 forwards, Calico, pod and service networks
    # Shared by the Lima template (k8s.yaml is rendered from k8s.yaml.in + provision/*.sh by bin/render-template,
    # which exports the template's param: values as ERA_* variables) and by the Packer builds (which export the
    # same variables, or none: every variable below has the template's default). Runs as root on Fedora 44.
    set -eux -o pipefail
    systemctl enable --now firewalld
    # API server, kubelet, NodePorts
    firewall-cmd --permanent --add-port=6443/tcp --add-port=10250/tcp --add-port=30000-32767/tcp
    # rossoctl URL ports -> the gateway NodePorts (for VMs reached by their own address)
    firewall-cmd --permanent --add-port=8080/tcp --add-port=8443/tcp
    firewall-cmd --permanent --add-forward-port=port=8080:proto=tcp:toport=30080
    firewall-cmd --permanent --add-forward-port=port=8443:proto=tcp:toport=30443
    # Calico: BGP, VXLAN, Typha (only matter if a second node ever joins; harmless on one)
    firewall-cmd --permanent --add-port=179/tcp --add-port=4789/udp --add-port=5473/tcp
    # pod and service networks are ours
    firewall-cmd --permanent --zone=trusted --add-source=10.244.0.0/16
    firewall-cmd --permanent --zone=trusted --add-source=10.96.0.0/12
    firewall-cmd --reload
- mode: system
  script: |
    #!/bin/bash
    # provision/50-crio.sh
    # era-k8s provisioning, step 50: CRI-O: pause image, systemd cgroups, the in-cluster registry as insecure
    # Shared by the Lima template (k8s.yaml is rendered from k8s.yaml.in + provision/*.sh by bin/render-template,
    # which exports the template's param: values as ERA_* variables) and by the Packer builds (which export the
    # same variables, or none: every variable below has the template's default). Runs as root on Fedora 44.
    set -eux -o pipefail
    [ -e /etc/crio/crio.conf.d/10-kubeadm.conf ] && exit 0
    command -v kubeadm >/dev/null || { echo "kubeadm missing: package step failed" >&2; exit 1; }
    mkdir -p /etc/crio/crio.conf.d
    cat <<EOF >/etc/crio/crio.conf.d/10-kubeadm.conf
    [crio.image]
    pause_image = "$(kubeadm config images list | grep pause | sort -r | head -n1)"
    [crio.runtime]
    cgroup_manager = "systemd"
    EOF
    # The in-cluster registry (rossoctl-deps, namespace cr-system) speaks plain HTTP; CRI-O and podman
    # share this registries.conf drop-in.
    cat <<EOF >/etc/containers/registries.conf.d/era-k8s.conf
    [[registry]]
    location = "localhost:30500"
    insecure = true
    [[registry]]
    location = "registry.cr-system.svc.cluster.local:5000"
    insecure = true
    EOF
    systemctl restart crio
- mode: system
  script: |
    #!/bin/bash
    # provision/60-k8s-init.sh
    export ERA_K8S_VERSION="{{.Param.version}}"
    export ERA_CALICO_VERSION="{{.Param.calicoVersion}}"
    export ERA_LOCAL_PATH_VERSION="{{.Param.localPathVersion}}"
    export ERA_DOMAIN="{{.Param.domain}}"
    export ERA_LLM_PROVIDER="{{.Param.llmProvider}}"
    export ERA_TLS="{{.Param.tls}}"
    export ERA_KUBEADM_INIT="{{.Param.kubeadmInit}}"
    # era-k8s provisioning, step 60: k8s-init.sh + k8s-init.service; initialize now (ERA_KUBEADM_INIT=true) or pre-pull and leave it to the first boot
    # Shared by the Lima template (k8s.yaml is rendered from k8s.yaml.in + provision/*.sh by bin/render-template,
    # which exports the template's param: values as ERA_* variables) and by the Packer builds (which export the
    # same variables, or none: every variable below has the template's default). Runs as root on Fedora 44.
    set -eux -o pipefail
    : "${ERA_KUBEADM_INIT:=true}"
    : "${ERA_K8S_VERSION:=stable}"
    : "${ERA_CALICO_VERSION:=v3.33.0}"
    : "${ERA_LOCAL_PATH_VERSION:=v0.0.37}"
    cat <<'INIT' >/usr/local/sbin/k8s-init.sh
    #!/bin/bash
    # Single-node kubeadm + CRI-O + Calico + local-path storage. Resumable: each phase checks its own
    # result and is skipped when already done, so a failed run is simply run again.
    set -eux -o pipefail
    export KUBECONFIG=/etc/kubernetes/admin.conf
    # versions baked in at provisioning (provision/20-config.sh); the defaults match the template's
    [ -f /etc/era-k8s/build.env ] && . /etc/era-k8s/build.env
    VERSION="${ERA_K8S_VERSION:-stable}"
    CALICO="${ERA_CALICO_VERSION:-v3.33.0}"
    LPV="${ERA_LOCAL_PATH_VERSION:-v0.0.37}"
    CRI=unix:///var/run/crio/crio.sock
    [ -f /etc/era-k8s/config.env ] && . /etc/era-k8s/config.env && echo "era-k8s config: domain=${ERA_DOMAIN:-} llm=${ERA_LLM_PROVIDER:-} tls=${ERA_TLS:-}"

    # Addresses. Under Lima the bridged interface is lima0 and may still be waiting for DHCP; elsewhere
    # the default-route interface is the one that matters. Every global IPv4 goes into the certificate.
    LAN_IF=lima0
    ip link show lima0 >/dev/null 2>&1 || LAN_IF=$(ip -4 route show default | awk '{print $5; exit}')
    LAN_IP=""
    for i in $(seq 1 45); do
      LAN_IP=$(ip -4 -o addr show "$LAN_IF" scope global 2>/dev/null | awk '{print $4}' | cut -d/ -f1 | head -n1)
      [ -n "$LAN_IP" ] && break
      sleep 2
    done
    IPS=$(ip -4 -o addr show scope global | awk '{print $4}' | cut -d/ -f1)
    echo "interface ${LAN_IF}: ${LAN_IP:-none}; certificate SANs: ${IPS}"

    # Phase 1: kubeadm init (skipped when the cluster exists)
    if [ ! -e /etc/kubernetes/admin.conf ]; then
      swapoff -a || true
      # Pin the node name to the hostname of this moment: the kubelet re-derives its name from the hostname at
      # every start, and Vagrant or cloud-init may rename the host after this init (found on the first VMware
      # box, 2026-10-18: "node era-k8s not found" after a reboot of a node registered as "fedora").
      NODE=$(hostname)
      echo "KUBELET_EXTRA_ARGS=--hostname-override=${NODE}" >/etc/sysconfig/kubelet
      kubeadm config images list --kubernetes-version="${VERSION}"
      kubeadm config images pull --kubernetes-version="${VERSION}" --cri-socket="${CRI}"
      {
        cat <<EOF
    kind: InitConfiguration
    apiVersion: kubeadm.k8s.io/v1beta4
    nodeRegistration:
      criSocket: ${CRI}
      name: ${NODE}
    ---
    kind: ClusterConfiguration
    apiVersion: kubeadm.k8s.io/v1beta4
    kubernetesVersion: "${VERSION}"
    apiServer:
      certSANs:
      - "127.0.0.1"
      - "$(hostname)"
    EOF
        for ip in ${IPS}; do echo "  - \"${ip}\""; done
        cat <<EOF
    networking:
      podSubnet: "10.244.0.0/16"
    ---
    kind: KubeletConfiguration
    apiVersion: kubelet.config.k8s.io/v1beta1
    cgroupDriver: systemd
    EOF
      } >/etc/kubeadm-config.yaml
      kubeadm init --config /etc/kubeadm-config.yaml
    fi
    until kubectl get --raw /readyz >/dev/null 2>&1; do sleep 3; done

    # Phase 2: Calico via the Tigera operator. The operator manifest creates the operator; the
    # operator then installs its own CRDs, so poll for the CRD before waiting on it.
    if ! kubectl get installation default >/dev/null 2>&1; then
      kubectl get deploy tigera-operator -n tigera-operator >/dev/null 2>&1 || \
        kubectl create -f "https://raw.githubusercontent.com/projectcalico/calico/${CALICO}/manifests/tigera-operator.yaml"
      for i in $(seq 1 120); do kubectl get crd installations.operator.tigera.io >/dev/null 2>&1 && break; sleep 3; done
      kubectl wait --for=condition=established --timeout=180s crd/installations.operator.tigera.io
      kubectl -n tigera-operator rollout status deploy/tigera-operator --timeout=300s
      cat <<EOF >/etc/calico-installation.yaml
    apiVersion: operator.tigera.io/v1
    kind: Installation
    metadata:
      name: default
    spec:
      calicoNetwork:
        nodeAddressAutodetectionV4:
          canReach: "1.1.1.1"
        ipPools:
        - name: default-ipv4-ippool
          blockSize: 26
          cidr: 10.244.0.0/16
          encapsulation: VXLANCrossSubnet
          natOutgoing: Enabled
          nodeSelector: all()
    ---
    apiVersion: operator.tigera.io/v1
    kind: APIServer
    metadata:
      name: default
    spec: {}
    EOF
      kubectl apply -f /etc/calico-installation.yaml
    fi
    kubectl taint nodes --all node-role.kubernetes.io/control-plane- 2>/dev/null || true

    # Phase 3: default StorageClass (rossoctl's charts create PersistentVolumeClaims).
    # SELinux enforcing: the provisioner's helper pod writes to this hostPath, so it must carry the
    # container file label (first build: "mkdir: Permission denied" without it).
    mkdir -p /opt/local-path-provisioner
    semanage fcontext -a -t container_file_t '/opt/local-path-provisioner(/.*)?' 2>/dev/null || true
    restorecon -R /opt/local-path-provisioner
    if ! kubectl get storageclass local-path >/dev/null 2>&1; then
      kubectl apply -f "https://raw.githubusercontent.com/rancher/local-path-provisioner/${LPV}/deploy/local-path-storage.yaml"
    fi
    kubectl annotate storageclass local-path storageclass.kubernetes.io/is-default-class=true --overwrite

    # Phase 4: kubeconfigs: root; a 127.0.0.1 variant (Lima's port forward); a LAN variant; every human user.
    mkdir -p /root/.kube && ln -sf "$KUBECONFIG" /root/.kube/config
    sed -e "/server:/ s|https://.*:\([0-9]*\)$|https://127.0.0.1:\1|" "$KUBECONFIG" >/root/.kube/config.localhost
    if [ -n "$LAN_IP" ]; then
      sed -e "/server:/ s|https://.*:\([0-9]*\)$|https://${LAN_IP}:\1|" "$KUBECONFIG" >/root/.kube/config.lan
    fi
    # every human account (home under /home; Lima's user is uid 501 with home /home/<user>.guest)
    getent passwd | awk -F: '$6 ~ /^\/home\// {print $1, $6}' | while read -r u h; do
      mkdir -p "$h/.kube" && cp -f "$KUBECONFIG" "$h/.kube/config" && chown -R "$u" "$h/.kube"
    done
    echo "k8s-init: done"
    INIT
    chmod 0755 /usr/local/sbin/k8s-init.sh

    cat <<'EOF' >/etc/systemd/system/k8s-init.service
    [Unit]
    Description=Initialize the single-node Kubernetes cluster on first boot (k8s-init.sh)
    After=network-online.target cloud-final.service crio.service kubelet.service
    Wants=network-online.target
    ConditionPathExists=!/etc/kubernetes/admin.conf
    [Service]
    Type=oneshot
    RemainAfterExit=yes
    ExecStart=/usr/local/sbin/k8s-init.sh
    StandardOutput=journal+console
    [Install]
    WantedBy=multi-user.target
    EOF
    systemctl daemon-reload
    systemctl enable k8s-init.service

    if [ "${ERA_KUBEADM_INIT}" = "true" ]; then
      /usr/local/sbin/k8s-init.sh
    else
      # Pre-init image (exported boxes): pull what the first boot needs, so it works without internet or
      # at least without waiting for it. Calico's images are pulled by the operator at init, by name below.
      CRI=unix:///var/run/crio/crio.sock
      kubeadm config images pull --kubernetes-version="${ERA_K8S_VERSION}" --cri-socket="${CRI}"
      OP=$(curl -fsSL "https://raw.githubusercontent.com/projectcalico/calico/${ERA_CALICO_VERSION}/manifests/tigera-operator.yaml" | awk '/image:/ {print $2; exit}')
      crictl -r "${CRI}" pull "${OP}"
      # Calico 3.33 ships three consolidated images on quay.io (what the operator pulls on the built clusters).
      for img in calico node third-party-cni-plugins; do
        crictl -r "${CRI}" pull "quay.io/calico/${img}:${ERA_CALICO_VERSION}" || echo "calico/${img}: not pre-pulled (optional)"
      done
      curl -fsSL "https://raw.githubusercontent.com/rancher/local-path-provisioner/${ERA_LOCAL_PATH_VERSION}/deploy/local-path-storage.yaml" | awk '/image:/ {print $2}' | sort -u | while read -r img; do crictl -r "${CRI}" pull "${img}"; done
      echo "ERA_KUBEADM_INIT=false: cluster not initialized; k8s-init.service will do it at the next boot"
    fi
probes:
- description: "kubeadm to be installed"
  script: |
    #!/bin/bash
    set -eux -o pipefail
    if ! timeout 30s bash -c "until command -v kubeadm >/dev/null 2>&1; do sleep 3; done"; then
      echo >&2 "kubeadm is not installed yet"
      exit 1
    fi
  hint: |
    See "/var/log/cloud-init-output.log" in the guest
- description: "kubernetes images to be pulled"
  script: |
    #!/bin/bash
    set -eux -o pipefail
    [ "{{.Param.kubeadmInit}}" = "true" ] || exit 0
    if ! timeout 30s bash -c "images=\"$(kubeadm config images list)\"; until for image in \$images; do sudo crictl inspecti \$image >/dev/null 2>&1 || exit 1; done; do sleep 3; done"; then
      echo >&2 "k8s images are not pulled yet"
      exit 1
    fi
- description: "kubeadm to be completed"
  script: |
    #!/bin/bash
    set -eux -o pipefail
    [ "{{.Param.kubeadmInit}}" = "true" ] || exit 0
    if ! timeout 300s bash -c "until test -f /etc/kubernetes/admin.conf; do sleep 3; done"; then
      echo >&2 "k8s is not running yet"
      exit 1
    fi
  hint: |
    The k8s kubeconfig file has not yet been created.
- description: "kubernetes cluster to be running"
  script: |
    #!/bin/bash
    set -eux -o pipefail
    [ "{{.Param.kubeadmInit}}" = "true" ] || exit 0
    if ! timeout 300s bash -c "until kubectl version >/dev/null 2>&1; do sleep 3; done"; then
      echo >&2 "kubernetes cluster is not up and running yet"
      exit 1
    fi
- description: "calico to be ready"
  script: |
    #!/bin/bash
    set -eux -o pipefail
    [ "{{.Param.kubeadmInit}}" = "true" ] || exit 0
    if ! timeout 600s bash -c "until kubectl -n calico-system wait --for=condition=ready pod -l k8s-app=calico-node --timeout=30s >/dev/null 2>&1; do sleep 5; done"; then
      echo >&2 "calico-node is not ready yet"
      exit 1
    fi
  hint: |
    kubectl -n tigera-operator logs deploy/tigera-operator ; kubectl -n calico-system get pods
- description: "default storageclass to exist"
  script: |
    #!/bin/bash
    set -eux -o pipefail
    [ "{{.Param.kubeadmInit}}" = "true" ] || exit 0
    if ! timeout 120s bash -c "until kubectl get storageclass local-path >/dev/null 2>&1; do sleep 3; done"; then
      echo >&2 "local-path StorageClass is not there yet"
      exit 1
    fi
- description: "coredns deployment to be running"
  script: |
    #!/bin/bash
    set -eux -o pipefail
    [ "{{.Param.kubeadmInit}}" = "true" ] || exit 0
    kubectl wait -n kube-system --timeout=300s --for=condition=available deploy coredns

copyToHost:
- guest: "/root/.kube/config.localhost"
  host: "{{.Dir}}/copied-from-guest/kubeconfig.yaml"
  deleteOnStop: true
- guest: "/root/.kube/config.lan"
  host: "{{.Dir}}/copied-from-guest/kubeconfig-lan.yaml"
  deleteOnStop: true

message: |
  (kubeadmInit=false builds stop before `kubeadm init`: `limactl stop k8s && ./lima-snap create k8s pre-init`,
  then export per export/RECIPIENT.md; the next `limactl start k8s` initializes the cluster via k8s-init.service,
  and a stop/start after that copies the kubeconfigs below.)
  To run `kubectl` on the host, run the following commands:
  ------
  export KUBECONFIG="{{.Dir}}/copied-from-guest/kubeconfig.yaml"
  kubectl get nodes
  ------
  From another machine on the LAN use "{{.Dir}}/copied-from-guest/kubeconfig-lan.yaml".

param:
  # pkgs.k8s.io channel: stable or prerelease
  stability: "stable"
  # Kubernetes minor to install: "stable" resolves the newest at creation time, or e.g. "v1.36"
  release: "stable"
  # exact version for kubeadm init: "stable" or e.g. "v1.37.1"
  version: "stable"
  # Calico release tag (operator install); v3.33.0 is built against Kubernetes 1.37
  calicoVersion: "v3.33.0"
  # Helm 3 release for the controller toolset (rossoctl needs >= 3.18, < 4)
  helmVersion: "v3.22.1"
  # rancher/local-path-provisioner release tag (default StorageClass)
  localPathVersion: "v0.0.37"
  # platform settings written to /etc/era-k8s/config.env (see provision step 2)
  domain: "localtest.me"
  llmProvider: "in-cluster"
  llmApiBase: "http://ollama.ollama.svc.cluster.local:11434/v1"
  llmModel: "llama3.2:3b-instruct-q4_K_M"
  tls: "true"
  # "true": initialize the cluster during provisioning. "false": install everything, pre-pull images,
  # and leave `kubeadm init` to k8s-init.service at the next boot (the exportable pre-init image).
  kubeadmInit: "true"
