name: Build and push images

on:
  push:
    branches: [main, era-k8s]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # The per-image smoke tests inside `build` prove each half imports and
  # constructs. This proves the two halves talk to each other over MCP, which
  # is where every bug that reached the cluster has actually lived. It gates
  # the push, so a broken call path never reaches GHCR.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the tool
        uses: docker/build-push-action@v7
        with:
          context: tool
          load: true
          tags: reservation-tool:integration
          cache-from: type=gha,scope=tool

      - name: Build the agent
        uses: docker/build-push-action@v7
        with:
          context: agent
          load: true
          tags: reservation-agent:integration
          cache-from: type=gha,scope=agent

      - name: Start the tool
        run: |
          docker run -d --name reservation-tool --network host             -e PORT=8000 reservation-tool:integration

      - name: Drive the tool from the agent image
        run: |
          docker run --rm --network host             -e MCP_URL=http://127.0.0.1:8000/mcp             reservation-agent:integration             python -m src.integrationtest

      - name: Tool logs, if that failed
        if: failure()
        run: docker logs reservation-tool

  build:
    needs: integration
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [agent, tool]
    steps:
      - uses: actions/checkout@v7

      - name: Lowercase the image owner
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # binfmt handlers so the runner can build and run linux/arm64 images
      # under emulation. Apple silicon hosts of the era-k8s VM pull them.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.OWNER_LC }}/reservation-${{ matrix.component }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Build into the local daemon first and actually run the code. Every
      # breakage this repo has had was an import error or a constructor
      # TypeError from an unpinned dependency moving, and a build-and-push
      # workflow that never runs the image publishes all of them happily.
      - name: Build for testing
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component }}
          load: true
          tags: reservation-${{ matrix.component }}:smoketest
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Smoke test the image
        run: |
          docker run --rm \
            -e LLM_API_BASE=http://smoketest.invalid/v1 \
            -e LLM_MODEL=smoketest \
            -e LLM_API_KEY=smoketest \
            reservation-${{ matrix.component }}:smoketest \
            python -m src.smoketest

      # The same proof for the arm64 half, emulated. It is slower than the
      # native build but catches a dependency with no aarch64 wheel, which
      # this slim image could not compile, before anything is pushed.
      - name: Build the arm64 image for testing
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component }}
          platforms: linux/arm64
          load: true
          tags: reservation-${{ matrix.component }}:smoketest-arm64
          cache-from: type=gha,scope=${{ matrix.component }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-arm64

      - name: Smoke test the arm64 image under QEMU
        run: |
          docker run --rm --platform linux/arm64 \
            -e LLM_API_BASE=http://smoketest.invalid/v1 \
            -e LLM_MODEL=smoketest \
            -e LLM_API_KEY=smoketest \
            reservation-${{ matrix.component }}:smoketest-arm64 \
            python -m src.smoketest

      # One manifest list per tag with both architectures, assembled from
      # the layers the two test builds just cached.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=${{ matrix.component }}
            type=gha,scope=${{ matrix.component }}-arm64
